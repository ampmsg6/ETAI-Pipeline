# Week 8. Preprocessing and selection fit within every inner/outer training fold.
data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"
  placeholder_tokens: ["-", "?", "n/a", "na", ""]
  numeric_columns: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "juvenile_total", "priors_count", "prior_offenses", "age_in_months", "decile_score"]
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]
  canonical_maps:
    sex: {male: Male, female: Female}
    race:
      african-american: African-American
      african american: African-American
      caucasian: Caucasian
      hispanic: Hispanic
      other: Other
      asian: Asian
      native american: Native American
    c_charge_degree: {f: F, felony: F, m: M, misdemeanor: M}
    score_text: {low: Low, medium: Medium, high: High}

diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    juv_misd_count: {min: 0}
    juv_other_count: {min: 0}
    priors_count: {min: 0, max: 60}

preprocessing:
  engineered_features: [] # Challenge 1: select explicitly or use main.py --features
  encoder: "target"  # onehot, ordinal, count, target
  scaler: "robust" # none, standard, minmax, robust
  numeric_imputer: "median" # median, knn, constant
  knn_neighbors: 5
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  imputation:
    age: {strategy: median, indicator: false}
    juv_fel_count: {strategy: median, indicator: false}
    sex: {strategy: most_frequent, indicator: false}
    priors_count: {strategy: median, indicator: true}
    c_charge_degree: {strategy: most_frequent, indicator: true}
    # Race is reserved for auditing; unknown race is not guessed.

split:
  # Kept for the Week 3 comparison scripts; matches the reserved test split.
  test_size: 0.2
  random_state: 42

test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  metrics: ["accuracy", "balanced_accuracy", "precision", "recall", "f1", "fbeta_2", "roc_auc", "average_precision"]
  selection_metric: "roc_auc"
  n_jobs: 1

model:
  type: "xgboost"
  params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, random_state: 42, n_jobs: -1}
  # decision_tree: {random_state: 42, class_weight: balanced}
  # logistic_regression: {max_iter: 2000, class_weight: balanced}
  # random_forest: {n_estimators: 200, random_state: 42, n_jobs: -1, class_weight: balanced}
  # oblique_random_forest: {n_estimators: 200, n_components: 10, random_state: 42, n_jobs: -1}
  # adaboost: {max_depth: 1, n_estimators: 200, learning_rate: 1.0, random_state: 42}
  # naive_bayes: {}
  # gradient_boosting: {random_state: 42}
  # hist_gradient_boosting: {random_state: 42, class_weight: balanced}
  # xgboost: use scale_pos_weight for class weighting; not class_weight.
  # class_weight: balanced is also supported by logistic regression, trees and forests;
  # weighting changes the precision/recall and false-positive tradeoff.

feature_selection:
  enabled: true
  min_votes: 2
  random_state: 42
  search_space:
    select__min_votes: {type: int, low: 1, high: 3}

tuning:
  enabled: true
  n_trials: 30
  n_splits: 5
  random_state: 42
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: int, low: 2, high: 30}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", 0.5, 1.0]}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: int, low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: int, low: 3, high: 10}
    adaboost:
      model__estimator__max_depth: {type: int, low: 1, high: 8}
      model__n_estimators: {type: int, low: 25, high: 400, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
    gradient_boosting:
      model__n_estimators: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_depth: {type: int, low: 1, high: 6}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
    hist_gradient_boosting:
      model__max_iter: {type: int, low: 25, high: 500, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.5, log: true}
      model__max_leaf_nodes: {type: int, low: 2, high: 63, log: true}
      model__min_samples_leaf: {type: int, low: 5, high: 200, log: true}
      model__l2_regularization: {type: float, low: 0.000001, high: 10.0, log: true}
    naive_bayes:
      model__var_smoothing: {type: float, low: 0.000000000001, high: 0.1, log: true}
    xgboost:
      model__n_estimators: {type: int, low: 50, high: 600, log: true}
      model__learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      model__max_depth: {type: int, low: 1, high: 8}
      model__min_child_weight: {type: float, low: 1.0, high: 50.0, log: true}
      model__subsample: {type: float, low: 0.5, high: 1.0}
      model__colsample_bytree: {type: float, low: 0.5, high: 1.0}
      model__reg_lambda: {type: float, low: 0.01, high: 10.0, log: true}
      model__reg_alpha: {type: float, low: 0.001, high: 10.0, log: true}
      model__gamma: {type: float, low: 0.0, high: 5.0}

output:
  results_dir: "results"
  scoreboard: "results/runs.csv"
